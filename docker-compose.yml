services:
  # 1. Persistent Vector Database Instance
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: omnibrain_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - omnibrain_network

  # 2. Main FastAPI Application Core Framework
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnibrain_api
    command: uvicorn omnibrain.app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - QDRANT_URL=http://qdrant:6333
    networks:
      - omnibrain_network
    # Waits strictly for Qdrant to be completely healthy, not just initializing
    depends_on:
      - qdrant

  # 3. Streamlit Frontend UI Module
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnibrain_ui
    command: streamlit run frontend/streamlit/app.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - BACKEND_API_URL=http://fastapi:8000/api/v1/chat
      - INGESTION_API_URL=http://fastapi:8000/api/v1/ingestion/upload
    networks:
      - omnibrain_network
    depends_on:
      - fastapi

volumes:
  qdrant_storage:

networks:
  omnibrain_network:
    driver: bridge
