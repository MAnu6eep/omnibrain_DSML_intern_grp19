services:
  fastapi:
    build:
      context: .
    command: uvicorn omnibrain.app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  streamlit:
    build:
      context: .
    command: streamlit run frontend/streamlit/app.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env.example
    ports:
      - "8501:8501"
    depends_on:
      - fastapi

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
