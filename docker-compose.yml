services:
  # 1. Persistent Vector Database Instance
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: omnibrain_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - omnibrain_network

    healthcheck:
    # Evaluates the internal port check safely within a true runtime shell container
      test: "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"
      interval: 5s
      timeout: 3s
      retries: 5
      
  # 2. Main FastAPI Application Core Framework
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnibrain_api
    command: uvicorn omnibrain.app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    networks:
      - omnibrain_network
    # Waits strictly for Qdrant to be completely healthy, not just initializing
    depends_on:
      qdrant:
        condition: service_healthy

  # 3. Streamlit Frontend UI Module
  streamlit:
    build:
      context: .
    container_name: omnibrain_ui
    command: streamlit run frontend/streamlit/app.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - BACKEND_URL=http://fastapi:8000
    networks:
      - omnibrain_network
    depends_on:
      - fastapi

volumes:
  qdrant_storage:

networks:
  omnibrain_network:
    driver: bridge